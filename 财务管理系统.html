document.addEventListener('click',e=>{const actionButton=e.target.closest('[data-action]');if(actionButton){if(actionButton.disabled)return;if(actionButton.dataset.action==='close-modal')return document.querySelector('#modal').close();action(actionButton.dataset.action);return}const group=e.target.closest('[data-group]');if(group){document.querySelector('#nav-'+group.dataset.group).hidden=!document.querySelector('#nav-'+group.dataset.group).hidden;return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}const o=e.target.closest('[data-open]');if(o){selected=o.dataset.open;goTo(target(doc()));return}const template=e.target.closest('[data-template]');if(template){report=template.dataset.template;render();return}const except=e.target.closest('[data-exception]');if(except){if(!requireRole('A'))return;const x=state.exceptions[Number(except.dataset.exception)];openModal('异常处置',`<p>${esc(x.record)} · ${esc(x.item)}<br><span class="subtitle">原值：${esc(x.value)}</span></p>${field('处置方式','转人工核验',{select:['转人工核验','修正后重试','忽略（说明原因）']})}${field('处置意见','',{name:'exception-note',area:true})}<div style="margin-top:20px">${btn('提交处置','exception-confirm',true)}</div>`);document.querySelector('#modal').dataset.exception=except.dataset.exception;return}const g=e.target.closest('[data-grant]');if(g){if(!requireRole('A'))return;const grant=state.grants[Number(g.dataset.grant)];if(grant.by===operators[role])return toast('开通人与复核人不能相同；当前演示只有一位审核人，保留待复核状态');return}const s=e.target.closest('[data-source]');if(s){document.querySelectorAll('[data-source]').forEach(n=>n.classList.toggle('active',n===s));toast(`已切换至${s.dataset.source}，登记字段一致`);return}const v=e.target.closest('[data-voucher-tab]');if(v){if(!requireRole(v.dataset.voucherTab==='编制'?'C':'A'))return;document.querySelectorAll('[data-voucher-tab]').forEach(n=>n.classList.toggle('active',n===v));return}const r=e.target.closest('[data-receipt-tab]');if(r){document.querySelectorAll('[data-receipt-tab]').forEach(n=>n.classList.toggle('active',n===r));document.querySelector('#receipt-body').innerHTML=r.dataset.receiptTab==='生成收入凭证'?`<div class="hint">开票与制证分别处理，只有已核销记录可制证。</div>${table(['来源记录编号','缴费人标识','金额','收入凭证号'],state.payments.filter(p=>p.state==='已核销').map(p=>[p.id,p.person,money(p.paid),p.voucher]))}`:`<div class="hint">票号：SJ202611000001 · 缴款人：20230021 · 金额：5,000.00 元 · ${state.receiptVoid?'已作废':'有效'}</div>`}});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;sessionStorage.setItem('finance-role',role);render();toast(`已切换至${names[role]}，按钮权限已更新`)}if(e.target.id==='doc-select'){selected=e.target.value;render()}if(e.target.name==='项目码'&&current==='U1.1'){const map={'1001':'教学运行经费','1002':'科研项目经费','1003':'学生工作经费','1004':'实验室建设经费','1005':'奖助专项经费','1006':'学科建设项目'};document.querySelector('[name="项目名称"]').value=map[e.target.value]}if(e.target.name==='收费项目'&&current==='U3.7'){const amount=e.target.value==='学费'?5000:1200;document.querySelector('[name="应缴"]').value=amount;document.querySelector('[name="实缴"]').value=amount}if(e.target.id==='import-file')window.importValidated=false});
document.addEventListener('input',e=>{if(/detail\d+amount/.test(e.target.name)){const sum=[...document.querySelectorAll('[name^="detail"][name$="amount"]')].reduce((s,i)=>s+Number(i.value),0);document.querySelector('#detail-total').textContent=money(sum)}});
document.addEventListener('focusout',e=>{if(e.target.name==='入库单号'&&current==='U3.1'){const map={'RK20261120000001':['FP202611200001',3280],'RK20261120000002':['FP202611200002',8600],'RK20261120000004':['FP202611200004',2400]},r=map[e.target.value],hint=document.querySelector('#reimbursement-errors');if(r){document.querySelector('[name="发票号码"]').value=r[0];document.querySelector('[name="物资金额"]').value=r[1];hint.textContent='入库单有效，发票号码与物资金额已带出。';hint.className='hint good'}else{hint.textContent='无入库单，报销单不得提交。';hint.className='hint bad'}}});
document.addEventListener('submit',e=>e.preventDefault());
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));current=pages[id]?id:'U0.1';render()});
current=pages[location.hash.slice(1)]?location.hash.slice(1):'U0.1';render();
</script></body></html>
